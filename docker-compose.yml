services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: jacob
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: testgrader
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: jacob
      DB_PASSWORD: password123
      DB_NAME: testgrader
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend/src:/app/src

  app:
    build: .
    ports:
      - "8501:8501"
    depends_on:
      - db
      - backend
    environment:
      DB_HOST: db
      DB_USER: jacob
      DB_PASSWORD: password123
      DB_NAME: testgrader
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      BACKEND_URL: http://backend:8000
    volumes:
      - ./app:/app

volumes:
  postgres_data: